<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;

        p {

            opacity: 0.85;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 1rem;

        }
        .links a {

            text-decoration: none;
            background: #1a1a1a;

            font-size: 1.05rem;

        .back {
